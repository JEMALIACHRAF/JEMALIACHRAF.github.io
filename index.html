<style>

[data-theme="dark"]{--bg:#07080f;--sf:#0d0f1a;--s2:#131622;--s3:#1a1e30;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--tx:#e8eaf0;--so:#8d95b0;--fa:#464e68;--ac:#4b8cf8;--ad:rgba(75,140,248,.14);--ag:rgba(75,140,248,.28);--gr:#34d399;--gd:rgba(52,211,153,.12);--gb:rgba(52,211,153,.25);--sh:0 20px 60px rgba(0,0,0,.55);--ss:0 4px 18px rgba(0,0,0,.38);--cg:0 0 40px rgba(75,140,248,.07);--nb:rgba(7,8,15,.86)}
[data-theme="light"]{--bg:#f4f6fc;--sf:#fff;--s2:#eef1f8;--s3:#e2e6f2;--bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.13);--tx:#0e1118;--so:#5a6282;--fa:#9098b2;--ac:#1d4ed8;--ad:rgba(29,78,216,.1);--ag:rgba(29,78,216,.25);--gr:#059669;--gd:rgba(5,150,105,.09);--gb:rgba(5,150,105,.22);--sh:0 8px 40px rgba(0,0,0,.09);--ss:0 2px 8px rgba(0,0,0,.06);--cg:none;--nb:rgba(244,246,252,.9)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:15px}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-weight:400;line-height:1.65;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}button{background:none;border:none;cursor:pointer;font-family:inherit}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:300;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;background:var(--nb);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid var(--bd);transition:background .3s}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;letter-spacing:-.03em}.logo .dot{color:var(--ac)}
.nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{font-size:.77rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--so);transition:color .2s}.nav-links a:hover{color:var(--ac)}
.nav-r{display:flex;align-items:center;gap:.6rem}
.ctrl{height:30px;padding:0 .85rem;border:1px solid var(--bd2);border-radius:5px;color:var(--so);font-size:.74rem;font-weight:600;letter-spacing:.06em;transition:border-color .2s,color .2s}.ctrl:hover{border-color:var(--ac);color:var(--ac)}

/* HERO */
#hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
#cvs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.h-glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 55% 45%,rgba(75,140,248,.07) 0%,transparent 70%)}
.h-fade{position:absolute;bottom:0;left:0;right:0;height:140px;z-index:2;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg))}
.hc{position:relative;z-index:3;padding:8rem 3rem 4rem;max-width:900px}
.avail{display:inline-flex;align-items:center;gap:.5rem;background:var(--gd);border:1px solid var(--gb);border-radius:999px;padding:.28rem .9rem;font-size:.75rem;font-weight:500;letter-spacing:.05em;color:var(--gr);margin-bottom:2rem}
.avail-dot{width:7px;height:7px;border-radius:50%;background:var(--gr);animation:pulse 2.2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.h-name{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(3rem,9vw,6.8rem);line-height:.9;letter-spacing:-.05em;color:var(--tx);margin-bottom:1.2rem}
.h-name .ghost{-webkit-text-stroke:1.5px var(--fa);color:transparent}
.h-ttl{font-family:'DM Mono',monospace;font-size:.9rem;color:var(--ac);letter-spacing:.03em;margin-bottom:1.2rem}
.h-desc{font-size:1rem;color:var(--so);max-width:520px;line-height:1.8;margin-bottom:2.8rem}
.h-acts{display:flex;gap:.9rem;flex-wrap:wrap;margin-bottom:2.8rem}
.bp{display:inline-flex;align-items:center;background:var(--ac);color:#fff;padding:.7rem 1.6rem;border-radius:6px;font-size:.83rem;font-weight:600;letter-spacing:.04em;transition:opacity .2s,transform .2s,box-shadow .2s}
.bp:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 8px 24px var(--ag)}
.bg2{display:inline-flex;align-items:center;border:1px solid var(--bd2);color:var(--so);padding:.7rem 1.6rem;border-radius:6px;font-size:.83rem;font-weight:600;letter-spacing:.04em;transition:border-color .2s,color .2s}
.bg2:hover{border-color:var(--ac);color:var(--ac)}
.h-contacts{display:flex;gap:2rem;flex-wrap:wrap}
.hci{font-family:'DM Mono',monospace;font-size:.74rem;color:var(--fa);display:flex;align-items:center;gap:.4rem;transition:color .2s}.hci:hover{color:var(--ac)}
.scroll-h{position:absolute;bottom:2rem;right:3rem;z-index:3;display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--fa);font-size:.67rem;letter-spacing:.12em;text-transform:uppercase}
.scroll-b{width:1px;height:44px;background:linear-gradient(to bottom,var(--ac),transparent);animation:sb 2s ease infinite}
@keyframes sb{0%{transform:scaleY(0);transform-origin:top;opacity:0}40%{opacity:1}100%{transform:scaleY(1);transform-origin:top;opacity:0}}

/* STATS */
#stats{background:var(--sf);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr)}
.sti{padding:1.8rem 1.5rem;border-right:1px solid var(--bd);text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3rem}.sti:last-child{border-right:none}
.stn{font-family:'Syne',sans-serif;font-weight:800;font-size:2.2rem;letter-spacing:-.04em;color:var(--ac);line-height:1}
.stl{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--so)}

/* SECTIONS */
.sec{padding:6rem 0}.sec.alt{background:var(--sf)}
.si{max-width:1100px;margin:0 auto;padding:0 3rem}
.shd{display:flex;align-items:baseline;gap:1.2rem;margin-bottom:3.5rem}
.snum{font-family:'DM Mono',monospace;font-size:.77rem;color:var(--ac);opacity:.7;letter-spacing:.08em}
.stit{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.04em;color:var(--tx)}

/* REVEAL */
.rv{opacity:0;transform:translateY(22px);transition:opacity .62s ease,transform .62s ease}.rv.in{opacity:1;transform:none}

/* TIMELINE */
.tl{position:relative;padding-left:2rem}.tl::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--bd2)}
.tli{position:relative;padding:0 0 3rem 2.5rem}.tli:last-child{padding-bottom:0}
.tli::before{content:'';position:absolute;left:-4.5px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--bg);box-shadow:0 0 8px var(--ac)}
.tlc{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:1.7rem 1.9rem;transform-style:preserve-3d;will-change:transform;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .12s ease}
.tlc:hover{border-color:rgba(75,140,248,.4);box-shadow:var(--cg),var(--ss)}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09) 0%,transparent 60%);transition:opacity .3s}
.tlc:hover .glare,.pjc:hover .glare{opacity:1}
.tlt{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.tld{font-family:'DM Mono',monospace;font-size:.71rem;color:var(--fa);letter-spacing:.04em;flex-shrink:0;padding-top:.2rem}
.tlr{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.02em;color:var(--tx)}
.tlco{color:var(--ac);font-size:.81rem;font-weight:500;margin-top:.15rem}
.tlbu{margin:.9rem 0;list-style:none}
.tlbu li{color:var(--so);font-size:.84rem;line-height:1.72;padding-left:1rem;position:relative;margin-bottom:.33rem}
.tlbu li::before{content:'—';position:absolute;left:0;color:var(--ac);opacity:.45}
.metric{color:var(--gr);font-weight:600}
.tltags{display:flex;flex-wrap:wrap;gap:.33rem;margin-top:.9rem}
.tag{background:var(--ad);border:1px solid rgba(75,140,248,.2);color:var(--ac);padding:.17rem .54rem;border-radius:4px;font-size:.71rem;font-weight:500;letter-spacing:.03em;transition:background .15s,border-color .15s}
.tag:hover{background:rgba(75,140,248,.22);border-color:var(--ac)}

/* PROJECTS */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.pjc{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:1.7rem;display:flex;flex-direction:column;transform-style:preserve-3d;will-change:transform;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .12s ease;cursor:default}
.pjc:hover{border-color:rgba(75,140,248,.38);box-shadow:var(--cg),var(--ss)}
.pjn{font-family:'DM Mono',monospace;font-size:.71rem;color:var(--fa);letter-spacing:.1em;margin-bottom:.9rem}
.pjna{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.02em;color:var(--tx);margin-bottom:.7rem}
.pjd{font-size:.82rem;color:var(--so);line-height:1.72;flex:1;margin-bottom:1.1rem}
.pjm{display:flex;flex-wrap:wrap;gap:.33rem;margin-bottom:1.1rem}
.pm{background:var(--gd);border:1px solid var(--gb);color:var(--gr);padding:.17rem .5rem;border-radius:4px;font-size:.7rem;font-weight:600;letter-spacing:.03em}
.pjf{display:flex;justify-content:space-between;align-items:flex-end;padding-top:1rem;border-top:1px solid var(--bd);margin-top:auto}
.pjst{font-size:.69rem;color:var(--fa);line-height:1.55;max-width:68%}
.pjlk{font-size:.75rem;font-weight:600;color:var(--ac);letter-spacing:.04em;display:flex;align-items:center;gap:.3rem;white-space:nowrap;transition:gap .2s}.pjlk:hover{gap:.5rem}

/* SKILLS */
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.skc{background:var(--bg);padding:1.7rem;transition:background .2s}[data-theme="light"] .skc{background:var(--sf)}.skc:hover{background:var(--s3)}
.skcn{font-family:'Syne',sans-serif;font-weight:700;font-size:.86rem;color:var(--tx);margin-bottom:.9rem}
.sktg{display:flex;flex-wrap:wrap;gap:.38rem}
.skt{background:var(--s2);border:1px solid var(--bd);color:var(--so);padding:.21rem .6rem;border-radius:4px;font-size:.73rem;transition:border-color .15s,color .15s,background .15s;cursor:default}
.skt:hover{border-color:var(--ac);color:var(--ac);background:var(--ad)}

/* EDUCATION */
.edg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
.edc{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:1.7rem;transition:border-color .2s}.edc:hover{border-color:var(--ac)}
.edy{font-family:'DM Mono',monospace;font-size:.71rem;color:var(--ac);letter-spacing:.07em;margin-bottom:.7rem}
.edd{font-family:'Syne',sans-serif;font-weight:700;font-size:.97rem;letter-spacing:-.02em;color:var(--tx);margin-bottom:.25rem}
.eds{color:var(--so);font-size:.81rem}.edt{color:var(--fa);font-size:.75rem;margin-top:.55rem}

/* CONTACT */
#contact{padding:6rem 0 7rem;text-align:center}
.cw{max-width:620px;margin:0 auto;padding:0 2rem}
.ctit{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.6rem,4vw,2.8rem);letter-spacing:-.04em;color:var(--tx);margin-bottom:1.1rem}
.cdsc{color:var(--so);font-size:.93rem;line-height:1.8;margin-bottom:2.4rem}
.cbtn{display:inline-block;background:var(--ac);color:#fff;padding:.85rem 2.4rem;border-radius:8px;font-size:.88rem;font-weight:600;letter-spacing:.03em;transition:opacity .2s,transform .2s;margin-bottom:1.8rem}
.cbtn:hover{opacity:.82;transform:translateY(-2px)}
.cinf{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;font-family:'DM Mono',monospace;font-size:.77rem;color:var(--so);margin-bottom:1.6rem}
.csoc{display:flex;justify-content:center;align-items:center;gap:1.2rem;font-size:.79rem;color:var(--fa)}
.csoc a{color:var(--ac);font-weight:500;transition:opacity .2s}.csoc a:hover{opacity:.7}

footer{padding:1.5rem 3rem;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:.74rem;color:var(--fa)}

@media(max-width:1024px){.pg{grid-template-columns:repeat(2,1fr)}.skg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){

  .hc{padding:6rem 1.4rem 2rem}.si{padding:0 1.4rem}
  .pg,.edg,.skg{grid-template-columns:1fr}#stats{grid-template-columns:repeat(2,1fr)}
  footer{padding:1.2rem 1.4rem;flex-direction:column;gap:.3rem;text-align:center}
}

</style>

// CANVAS PARTICLES
function initParticles(){
  const cv=document.getElementById('cvs'),ctx=cv.getContext('2d');
  let pts=[],W=0,H=0,mx=-999,my=-999;
  function resize(){
    W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;
    const n=Math.min(Math.floor(W*H/11000),90);
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.38,vy:(Math.random()-.5)*.38,r:Math.random()*1.8+.8}));
  }
  window.addEventListener('resize',resize);
  cv.parentElement.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
  cv.parentElement.addEventListener('mouseleave',()=>{mx=-999;my=-999;});
  function col(){return theme==='dark'?[75,140,248]:[29,78,216];}
  function draw(){
    requestAnimationFrame(draw);ctx.clearRect(0,0,W,H);
    const[r,g,b]=col(),MAX=130;
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<90){p.x-=dx*.028;p.y-=dy*.028;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${r},${g},${b},.65)`;ctx.fill();
    });
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const p1=pts[i],p2=pts[j],dx=p1.x-p2.x,dy=p1.y-p2.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<MAX){ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle=`rgba(${r},${g},${b},${(1-d/MAX)*.22})`;ctx.lineWidth=.55;ctx.stroke();}
    }
  }
  resize();draw();
}

// 3D TILT
function initTilt(){
  document.querySelectorAll('.tilt').forEach(el=>{
    const gl=el.querySelector('.glare');
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      el.style.transform=`perspective(900px) rotateX(${(y-.5)*-11}deg) rotateY(${(x-.5)*11}deg) scale3d(1.02,1.02,1.02)`;
      if(gl){gl.style.setProperty('--mx',(x*100)+'%');gl.style.setProperty('--my',(y*100)+'%');}
    });
    el.addEventListener('mouseleave',()=>{el.style.transform='perspective(900px) rotateX(0) rotateY(0) scale3d(1,1,1)';});
  });
}

// SCROLL REVEAL
let revObs;
function initReveal(){
  if(revObs)revObs.disconnect();
  revObs=new IntersectionObserver(entries=>{
    entries.forEach((entry,i)=>{
      if(!entry.isIntersecting)return;
      setTimeout(()=>entry.target.classList.add('in'),i*65);
      revObs.unobserve(entry.target);
    });
  },{threshold:.07});
  document.querySelectorAll('.rv:not(.in)').forEach(el=>{
    const rc=el.getBoundingClientRect();
    if(rc.top<window.innerHeight&&rc.bottom>0)el.classList.add('in');
    else revObs.observe(el);
  });
}

// COUNTERS
function initCounters(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      const el=entry.target,target=+el.dataset.target,suf=el.dataset.suffix||'',t0=performance.now();
      const step=ts=>{
        const p=Math.min((ts-t0)/1400,1),e=1-Math.pow(1-p,3);
        el.textContent=Math.round(e*target)+suf;
        if(p<1)requestAnimationFrame(step);
      };
      requestAnimationFrame(step);obs.unobserve(el);
    });
  },{threshold:.5});
  document.querySelectorAll('.stn[data-target]').forEach(el=>obs.observe(el));
}

renderAll();initParticles();initCounters();
